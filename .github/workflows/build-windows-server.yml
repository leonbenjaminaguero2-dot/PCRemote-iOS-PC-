name: Build PCRemote Windows Server
on:
  workflow_dispatch:
  push:
    paths:
      - 'WindowsServer/**'
      - '.github/workflows/build-windows-server.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish WindowsServer/PCRemoteServer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: PCRemote-Windows-x64
          path: publish/**
